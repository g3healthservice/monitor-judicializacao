name: Monitor de Licitacoes (sem registro)

# Agente de licitacoes, etapas 1 a 4: coleta diaria no PNCP (UASG 250005 - DLOG/MS),
# leitura de edital/TR, marcacao das demandas que admitem medicamento sem registro
# acompanhamento do resultado de cada item, nota de viabilidade, cenarios e alertas.
# Grava no mesmo monitor.db do monitor de judicializacao (tabelas lic_*).
on:
  schedule:
    - cron: "17 9 * * *"     # todo dia, 06:17 em Brasilia
  workflow_dispatch:
    inputs:
      desde:
        description: "Reprocessar desde (AAAA-MM-DD). Vazio = incremental."
        required: false
        default: ""

permissions:
  contents: write

# Mesmo grupo do workflow de judicializacao: os dois gravam monitor.db e nunca
# rodam ao mesmo tempo (evita conflito no commit do banco).
concurrency:
  group: monitor-db
  cancel-in-progress: false

jobs:
  licitacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils libarchive-tools   # pdftotext e leitura de .rar
          pip install ./monitor-licitacoes

      - name: Coletar e avaliar
        env:
          LIC_DB_PATH: monitor.db
          LIC_UASGS: "250005"
          LIC_MODALIDADES: "6"
          LIC_LOOKBACK_DIAS: "330"   # primeira execucao: 2026 inteiro
          LIC_SAIDA_DIR: monitor-licitacoes/saida
        run: |
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            python -m licitacoes.cli coletar --desde "${{ github.event.inputs.desde }}" --por publicacao --reprocessar
          else
            python -m licitacoes.cli coletar
          fi
          # Etapa 2: situacao, vencedor e ata dos itens ainda sem resultado final.
          python -m licitacoes.cli acompanhar
          python -m licitacoes.cli candidatas > /dev/null
          python -m licitacoes.cli resultados > monitor-licitacoes/saida/licitacoes_resultados.txt
          # Etapa 3: ficha e nota de viabilidade (premissas.yaml + cotacoes.csv).
          python -m licitacoes.cli viabilidade > monitor-licitacoes/saida/licitacoes_viabilidade.txt
          # Etapa 4a: cenarios (cambio, imposto, frete, volume) dos itens cotados.
          python -m licitacoes.cli simular > monitor-licitacoes/saida/licitacoes_cenarios.txt
          # Painel publico (GitHub Pages): so dados do PNCP, sem cotacoes.
          python -m licitacoes.cli painel --saida docs/licitacoes/index.html
          python -m licitacoes.cli eventos --desde "$(date -u -d '-1 day' '+%Y-%m-%d')" \
            > monitor-licitacoes/saida/licitacoes_eventos.txt
          {
            cat monitor-licitacoes/saida/licitacoes_candidatas.md
            echo; echo "## Mudanças nas últimas 24 horas"; echo; echo '```'
            cat monitor-licitacoes/saida/licitacoes_eventos.txt
            echo '```'
            echo; echo "## Cenários dos itens cotados"; echo; echo '```'
            cat monitor-licitacoes/saida/licitacoes_cenarios.txt
            echo '```'
            echo; echo "## Viabilidade por item"; echo; echo '```'
            cat monitor-licitacoes/saida/licitacoes_viabilidade.txt
            echo '```'
            echo; echo "## Situação por item das candidatas"; echo; echo '```'
            cat monitor-licitacoes/saida/licitacoes_resultados.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Etapa 4b: um unico e-mail (e Telegram, se configurado) com os alertas novos.
      # Sem os Secrets, nada e enviado e os alertas ficam pendentes no banco.
      - name: Enviar alertas
        if: ${{ !cancelled() }}   # roda mesmo se a coleta falhar em parte
        env:
          LIC_DB_PATH: monitor.db
          # Gmail por padrao; um Secret com o mesmo nome substitui o valor.
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          # Secrets obrigatorios para o e-mail: SMTP_USER, SMTP_PASSWORD (senha de app) e ALERT_EMAIL_TO.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}         # opcional: vazio = SMTP_USER
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m licitacoes.cli alertas | tee monitor-licitacoes/saida/licitacoes_alertas.txt
          { echo; echo "## Alertas desta execução"; echo; echo '```'
            cat monitor-licitacoes/saida/licitacoes_alertas.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit do banco e da lista de candidatas
        if: ${{ !cancelled() }}   # guarda o progresso mesmo se a coleta falhar em parte
        run: |
          git config user.name  "g3-bot"
          git config user.email "g3.representante@gmail.com"
          git add -f monitor.db monitor-licitacoes/saida/ docs/licitacoes/index.html
          git commit -m "Licitacoes: atualizacao automatica $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "sem mudancas"
          git push
